name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.2.0) — overrides tag when run manually"
        required: false
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    name: Build, Sign & Upload AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub releases

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Resolve version strings ──────────────────────────────────────────────
      - name: Resolve version name
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.0-dev"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName: ${VERSION_NAME}"

      # ── Java 21 ─────────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Node + pnpm ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # ── Next.js build + Capacitor sync ────────────────────────────────────────
      - name: Build Next.js app
        run: pnpm --filter relay build
        working-directory: .

      - name: Sync Capacitor Android project
        run: npx cap sync android
        working-directory: apps/relay

      # ── Auto-increment versionCode ────────────────────────────────────────────
      - name: Bump versionCode and set versionName
        id: bump
        working-directory: apps/relay/android/app
        run: |
          CURRENT=$(grep -oP 'versionCode \K\d+' build.gradle)
          NEW_CODE=$((CURRENT + 1))
          # Patch versionCode
          sed -i "s/versionCode ${CURRENT}/versionCode ${NEW_CODE}/" build.gradle
          # Patch versionName
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" build.gradle
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "Bumped versionCode: ${CURRENT} → ${NEW_CODE}"
          echo "Set versionName: ${{ steps.version.outputs.version_name }}"

      # ── Decode keystore from secret ───────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apps/relay/android/relay-release.keystore

      # ── Build release AAB ────────────────────────────────────────────────────
      - name: Build release AAB
        working-directory: apps/relay/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/relay/android/relay-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── Locate signed AAB ─────────────────────────────────────────────────────
      - name: Locate signed AAB
        id: aab
        run: |
          AAB_PATH=$(find apps/relay/android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "path=${AAB_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found AAB: ${AAB_PATH}"

      # ── Authenticate with Google Play Developer API ──────────────────────────
      # The service account JSON is used to create a self-signed JWT (RS256),
      # which is exchanged for a short-lived OAuth2 bearer token.
      # Python's `cryptography` package is pre-installed on ubuntu-latest.
      - name: Get Google Play API access token
        id: gplay_auth
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          ACCESS_TOKEN=$(python3 - <<'PYEOF'
          import json, time, base64, os, urllib.request, urllib.parse
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.backends import default_backend

          def b64url(data):
              if isinstance(data, str):
                  data = data.encode("utf-8")
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          sa = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
          token_uri = sa.get("token_uri", "https://oauth2.googleapis.com/token")
          now = int(time.time())

          header  = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}))
          payload = b64url(json.dumps({
              "iss":   sa["client_email"],
              "scope": "https://www.googleapis.com/auth/androidpublisher",
              "aud":   token_uri,
              "iat":   now,
              "exp":   now + 3600,
          }))

          signing_input = f"{header}.{payload}".encode("utf-8")
          private_key   = serialization.load_pem_private_key(
              sa["private_key"].encode("utf-8"), password=None, backend=default_backend()
          )
          sig = private_key.sign(signing_input, padding.PKCS1v15(), hashes.SHA256())
          jwt = f"{header}.{payload}.{b64url(sig)}"

          data = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion":  jwt,
          }).encode("utf-8")
          req = urllib.request.Request(token_uri, data=data, method="POST")
          req.add_header("Content-Type", "application/x-www-form-urlencoded")
          with urllib.request.urlopen(req) as resp:
              print(json.loads(resp.read())["access_token"])
          PYEOF
          )
          echo "access_token=${ACCESS_TOKEN}" >> "$GITHUB_OUTPUT"

      # ── Upload to Google Play (internal testing track) ───────────────────────
      # Step 1: open an edit session
      - name: Create Google Play edit
        id: gplay_edit
        env:
          TOKEN: ${{ steps.gplay_auth.outputs.access_token }}
        run: |
          RESPONSE=$(curl --silent --fail \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/io.getrelay.app/edits")
          EDIT_ID=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "edit_id=${EDIT_ID}" >> "$GITHUB_OUTPUT"
          echo "Opened edit: ${EDIT_ID}"

      # Step 2: upload the AAB into the edit
      - name: Upload AAB
        id: gplay_upload
        env:
          TOKEN: ${{ steps.gplay_auth.outputs.access_token }}
          EDIT_ID: ${{ steps.gplay_edit.outputs.edit_id }}
          AAB_PATH: ${{ steps.aab.outputs.path }}
        run: |
          RESPONSE=$(curl --silent --fail \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${AAB_PATH}" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/io.getrelay.app/edits/${EDIT_ID}/bundles?uploadType=media")
          echo "Upload response: ${RESPONSE}"
          VERSION_CODE=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin)['versionCode'])")
          echo "Uploaded versionCode: ${VERSION_CODE}"

      # Step 3: assign the AAB to the internal track
      - name: Assign to internal track
        env:
          TOKEN: ${{ steps.gplay_auth.outputs.access_token }}
          EDIT_ID: ${{ steps.gplay_edit.outputs.edit_id }}
          VERSION_CODE: ${{ steps.bump.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          TRACK_BODY=$(python3 -c "
          import json, sys
          print(json.dumps({
              'track': 'internal',
              'releases': [{
                  'name':         '${VERSION_NAME}',
                  'versionCodes': ['${VERSION_CODE}'],
                  'status':       'completed',
              }]
          }))
          ")
          curl --silent --fail \
            -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${TRACK_BODY}" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/io.getrelay.app/edits/${EDIT_ID}/tracks/internal"

      # Step 4: commit the edit to make the release live on the track
      - name: Commit edit
        env:
          TOKEN: ${{ steps.gplay_auth.outputs.access_token }}
          EDIT_ID: ${{ steps.gplay_edit.outputs.edit_id }}
        run: |
          curl --silent --fail \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/io.getrelay.app/edits/${EDIT_ID}:commit"
          echo "Edit committed — build is live on internal testing track"

      # ── Create GitHub release ─────────────────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Relay Android v${{ steps.version.outputs.version_name }}"
          body: |
            **versionCode**: ${{ steps.bump.outputs.version_code }}
            **versionName**: ${{ steps.version.outputs.version_name }}

            Uploaded to Google Play internal testing track.
          files: ${{ steps.aab.outputs.path }}
          draft: false
          prerelease: false
